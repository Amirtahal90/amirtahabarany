<!doctype html>

<title>امیرطاها بارانی | برنامه‌نویس وب</title>

<style>
:root{--bg:#06070a;--text:#f7f8fa;--muted:#a3a7b0;--line:#242833;--card:#101217}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% -10%,#20232d 0,#0c0e13 37%,var(--bg) 72%);color:var(--text);font-family:"Vazirmatn",Tahoma,sans-serif}.shell{width:min(620px,100%);animation:appear .7s ease both}.intro{padding:34px 28px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,#15171d,#0d0f13);box-shadow:0 28px 90px #000b;text-align:center}.badge{display:inline-flex;padding:7px 14px;border:1px solid #353943;border-radius:999px;background:#111319;color:#d5d8df;font-size:.8rem}h1{margin:18px 0 8px;font-size:clamp(2.25rem,9vw,4.3rem);line-height:1.13;font-weight:800;letter-spacing:-.8px}h1 span{color:#b9bec8}.bio{margin:0 auto;max-width:520px;color:var(--muted);font-size:.98rem;line-height:2.05}.socials{display:flex;flex-direction:column;gap:12px;margin-top:16px}.social{position:relative;display:flex;align-items:center;justify-content:center;min-height:72px;border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#111319,#0c0e12);box-shadow:inset 0 1px #ffffff08,0 10px 28px #0004;transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease,background .25s ease;overflow:hidden;text-decoration:none}.social::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--glow),transparent 62%);opacity:.18;transition:opacity .25s ease}.social:hover,.social:focus-visible{transform:translateY(-4px);border-color:var(--border);box-shadow:0 16px 34px #0008,0 0 28px var(--glow-soft);outline:none}.social:hover::before,.social:focus-visible::before{opacity:.32}.social img,.social svg{position:relative;width:31px;height:31px;filter:drop-shadow(0 5px 14px var(--glow-soft))}.instagram{--glow:#e4405f;--glow-soft:#e4405f55;--border:#e4405f66}.telegram{--glow:#2aabee;--glow-soft:#2aabee55;--border:#2aabee66}.phone{--glow:#22c55e;--glow-soft:#22c55e55;--border:#22c55e66}.email{--glow:#f59e0b;--glow-soft:#f59e0b55;--border:#f59e0b66}.footer{text-align:center;margin-top:16px;color:#656a74;font-size:.72rem}@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){.intro{padding:28px 18px;border-radius:25px}.social{min-height:68px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<section class="intro">
<span class="badge">برنامه‌نویس وب</span>
<h1>امیرطاها <span>بارانی</span></h1>
<p class="bio">طراحی و توسعه تجربه‌های وب سریع، تمیز و مدرن؛ با علاقه به رابط کاربری، کدنویسی دقیق و ساخت ایده‌هایی که ساده اما ماندگارند.</p>
</section>

<nav class="socials" aria-label="راه‌های ارتباطی">

</a>

<img src="https://cdn.simpleicons.org/telegram/2AABEE" alt="" width="31" height="31" loading="lazy">
</a>

</nav>
