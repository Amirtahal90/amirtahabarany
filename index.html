<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="امیرطاها بارانی — برنامه‌نویس وب">
<meta name="theme-color" content="#ffffff">
<title>امیرطاها بارانی | برنامه‌نویس وب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--text:#14161a;--muted:#727780;--line:#e9ebef;--panel:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#fff;color:var(--text);font-family:"Vazirmatn",Tahoma,sans-serif}
.shell{width:min(620px,100%);animation:appear .7s cubic-bezier(.2,.7,.2,1) both}
.intro{position:relative;padding:42px 30px 34px;text-align:center;border:1px solid var(--line);border-radius:30px;background:#fff;box-shadow:0 18px 55px rgba(25,31,40,.08);overflow:hidden}
.intro::after{content:"";position:absolute;inset:auto 18% 0;height:1px;background:linear-gradient(90deg,transparent,#d9dde4,transparent)}
.badge{display:inline-flex;padding:7px 14px;border:1px solid #e4e7ec;border-radius:999px;background:#fafbfc;color:#6d727c;font-size:.8rem}
h1{margin:18px 0 10px;font-size:clamp(2.3rem,9vw,4.3rem);line-height:1.15;font-weight:800;letter-spacing:-.7px;display:inline-block;position:relative}
.name{position:relative;display:inline-block;background:linear-gradient(110deg,#101218 0%,#101218 35%,#6f7784 50%,#101218 65%,#101218 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s ease-in-out infinite}
.name::after{content:"";position:absolute;left:7%;right:7%;bottom:-5px;height:4px;border-radius:99px;background:linear-gradient(90deg,#111 0%,#7d8591 50%,#111 100%);background-size:220% 100%;animation:lineflow 3.2s ease-in-out infinite;transform-origin:center}
.bio{margin:0 auto;max-width:520px;color:var(--muted);font-size:.98rem;line-height:2.05}
.socials{display:flex;align-items:stretch;margin-top:16px;padding:8px;border:1px solid var(--line);border-radius:23px;background:#fff;box-shadow:0 18px 45px rgba(25,31,40,.08)}
.social{position:relative;flex:1;min-height:82px;display:flex;align-items:center;justify-content:center;border-radius:17px;text-decoration:none;transition:transform .22s ease,background .22s ease,box-shadow .22s ease}
.social+.social{border-right:1px solid var(--line)}
.social:hover,.social:focus-visible{transform:translateY(-3px);background:#fafbfd;box-shadow:0 10px 24px rgba(25,31,40,.07);outline:none}
.social::after{content:"";position:absolute;inset:16px 20%;border-radius:50%;background:var(--glow);filter:blur(18px);opacity:0;transition:opacity .22s ease;z-index:0}
.social:hover::after,.social:focus-visible::after{opacity:.12}
.social img,.social svg{position:relative;z-index:1;width:34px;height:34px;display:block;filter:drop-shadow(0 5px 12px var(--shadow))}
.instagram{--glow:#e4405f;--shadow:#e4405f44}
.telegram{--glow:#2aabee;--shadow:#2aabee44}
.phone{--glow:#22c55e;--shadow:#22c55e44;color:#22c55e}
.email{--glow:#f59e0b;--shadow:#f59e0b44;color:#f59e0b}
.footer{text-align:center;margin-top:16px;color:#9ba0a9;font-size:.72rem}
@keyframes appear{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shine{0%,18%{background-position:200% 0}50%{background-position:0 0}82%,100%{background-position:-180% 0}}
@keyframes lineflow{0%,100%{background-position:100% 0;opacity:.72}50%{background-position:0 0;opacity:1}}
@media(max-width:520px){.intro{padding:30px 18px 26px;border-radius:25px}.socials{padding:6px;border-radius:20px}.social{min-height:72px}.social+.social{border-right:1px solid var(--line)}.social img,.social svg{width:30px;height:30px}h1{letter-spacing:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}.name{background:none;color:var(--text)}.name::after{animation:none}}
</style>
</head>
<body>
<main class="shell">
<section class="intro" aria-labelledby="name">
<span class="badge">برنامه‌نویس وب</span>
<h1 id="name"><span class="name">امیرطاها بارانی</span></h1>
<p class="bio">طراحی و توسعه تجربه‌های وب سریع، تمیز و مدرن؛ با تمرکز روی رابط کاربری، کدنویسی دقیق و ساخت ایده‌هایی که ساده اما ماندگارند.</p>
</section>

<nav class="socials" aria-label="راه‌های ارتباطی">
<a class="social instagram" href="#" aria-label="اینستاگرام" title="اینستاگرام">
<img src="https://cdn.simpleicons.org/instagram/E4405F" alt="" width="34" height="34" loading="lazy">
</a>
<a class="social telegram" href="#" aria-label="تلگرام" title="تلگرام">
<img src="https://cdn.simpleicons.org/telegram/2AABEE" alt="" width="34" height="34" loading="lazy">
</a>
<a class="social phone" href="#" aria-label="تماس" title="تماس">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6.27 6.27l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92Z"/></svg>
</a>
<a class="social email" href="#" aria-label="ایمیل" title="ایمیل">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
</a>
</nav>

<div class="footer">© ۱۴۰۵ امیرطاها بارانی</div>
</main>
</body>
</html>
